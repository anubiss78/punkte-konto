name: Android-App bauen
on:
  workflow_dispatch:
  push:
    paths: ["capacitor.config.json", "package.json", "assets/**", "signing/**", ".github/workflows/android.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Android SDK prüfen
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"
      - name: Seiten-Adresse eintragen
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"; REPO="${GITHUB_REPOSITORY#*/}"
          sed -i "s#https://OWNER.github.io/REPO/#https://$OWNER.github.io/$REPO/#" capacitor.config.json
          cat capacitor.config.json
      - run: npm install
      - run: npx cap add android
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - name: Feste Signatur verwenden (damit Updates über die alte App installiert werden können)
        run: mkdir -p ~/.android && cp signing/app.keystore ~/.android/debug.keystore
      - name: APK bauen
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Release veröffentlichen
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk PunkteKonto.apk
          gh release delete app-latest -y --cleanup-tag || true
          gh release create app-latest PunkteKonto.apk --title "Punkte Konto App" --notes "Zum Installieren auf dem Android-Handy die Datei PunkteKonto.apk herunterladen und öffnen."
